<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALE-to.so → Metarubrics</title>
  <meta name="description" content="ALE-to.so ahora es Metarubrics.">
  <link rel="canonical" href="https://coyotemera.github.io/metarubrics/">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%230d0d0d'/><text x='50' y='72' font-size='62' font-family='monospace' fill='%23ebe8dc' text-anchor='middle'>&#9670;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&family=Kumar+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #000;
      --text:   #ebe8dc;
      --dim:    #858585;
      --muted:  #696969;
      --border: #2a2a2a;
      --ui:      'Manrope', system-ui, sans-serif;
      --display: 'Kumar One', var(--ui);
      color-scheme: dark;   /* so the scrollbar is not white on black */
    }
    html, body { height: 100%; }
    body {
      /* border-box, or the padding stacks on top of height:100% and the page
         scrolls a couple of rem for nothing */
      box-sizing: border-box;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      font-family: var(--ui);
      -webkit-font-smoothing: antialiased;
    }

    /* fixed, so the sky stays out of the centring grid instead of claiming a cell */
    #sky { position: fixed; inset: 0; pointer-events: none; }
    main { position: relative; max-width: 30rem; text-align: center; }

    .old {
      font-size: clamp(1rem, 3.4vw, 1.25rem);
      letter-spacing: .12em;
      color: var(--muted);
      margin: 0 0 1.3rem;
    }

    /* Small and untracked, against the tracked name above it — the two lines
       read as one caption rather than as two competing labels. */
    .now {
      font-size: .8rem;
      letter-spacing: .04em;
      color: var(--dim);
      margin: 0 0 2rem;
    }

    h1 {
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(2.4rem, 9vw, 4rem);
      line-height: 1;
      margin: 0 0 2.75rem;
    }

    a.go {
      display: inline-block;
      padding: .8rem 1.6rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      letter-spacing: .02em;
      transition: border-color .18s, background-color .18s;
    }
    a.go:hover, a.go:focus-visible { border-color: var(--text); background: rgba(235,232,220,.06); }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <main>
    <p class="old">ALE-to.so</p>
    <p class="now">ahora es</p>
    <h1>Metarubrics</h1>
    <a class="go" href="https://coyotemera.github.io/metarubrics/">Ir a Metarubrics →</a>
  </main>

  <script>
  // ============================================================
  // The star field from Metarubrics' empty state, turned down.
  // ============================================================
  //
  // Same idea — glyphs on a character grid, each breathing on its own sine
  // phase — but this page is a signpost someone reads for two seconds, not a
  // surface they sit in front of. So: a looser grid, fewer stars, half the ink,
  // and no shooting stars at all. A meteor is something you wait for, and there
  // is nothing here worth waiting for.
  (function () {
    const cv = document.getElementById('sky');
    const main = document.querySelector('main');
    if (!cv || !cv.getContext) return;

    const RAMP  = ['.', ':', '*'];   // the app also uses '#' and '@'; both read as loud here
    const INK   = '235, 232, 220';
    const GLYPH = 'ui-monospace, "Cascadia Mono", Consolas, monospace';

    const CELL_W = 16, CELL_H = 20;   // looser than the app's 13×17 — more air between specks
    const DENSITY = 0.07;             // app: 0.085
    const FPS = 12;
    const CLEAR_PAD = 24;             // hard keep-out past the text's own box
    const CLEAR_BAND = 120;           // and a wide fade past that, so the type sits in a clearing

    const still = matchMedia('(prefers-reduced-motion: reduce)');
    let ctx = null, stars = [], w = 0, h = 0;

    // 0 inside the text's box, 1 once past the band around it
    function clearance(box, x, y) {
      if (!box) return 1;
      const dx = Math.max(box.x0 - x, 0, x - box.x1);
      const dy = Math.max(box.y0 - y, 0, y - box.y1);
      return Math.min(1, Math.hypot(dx, dy) / CLEAR_BAND);
    }

    function layout() {
      w = window.innerWidth; h = window.innerHeight;
      const r = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.round(w * r); cv.height = Math.round(h * r);
      cv.style.width = w + 'px'; cv.style.height = h + 'px';
      ctx = cv.getContext('2d');
      ctx.setTransform(r, 0, 0, r, 0, 0);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      let box = null;
      if (main) {
        const m = main.getBoundingClientRect();
        box = { x0: m.left - CLEAR_PAD, x1: m.right  + CLEAR_PAD,
                y0: m.top  - CLEAR_PAD, y1: m.bottom + CLEAR_PAD };
      }

      const cols = Math.max(1, Math.floor(w / CELL_W));
      const rows = Math.max(1, Math.floor(h / CELL_H));
      const offX = (w - cols * CELL_W) / 2, offY = (h - rows * CELL_H) / 2;
      const taken = new Set();
      stars = [];
      for (let i = 0, want = Math.round(cols * rows * DENSITY); i < want; i++) {
        const gx = (Math.random() * cols) | 0, gy = (Math.random() * rows) | 0;
        const key = gy * cols + gx;
        if (taken.has(key)) continue;          // one star per cell, or they collide
        taken.add(key);
        const x = offX + (gx + 0.5) * CELL_W, y = offY + (gy + 0.5) * CELL_H;
        // the clearing is spent twice: as the odds this star exists at all, and
        // as a ceiling on how bright it gets — culling alone leaves a hard edge
        const room = clearance(box, x, y);
        if (room === 0 || Math.random() > room) continue;
        stars.push({
          x: x, y: y,
          // biased hard toward the dim end: a sky is mostly faint specks
          base:  (0.10 + 0.90 * Math.pow(Math.random(), 2.6)) * room,
          speed: 0.20 + Math.random() * 0.55,  // slower than the app's 0.30–1.15
          phase: Math.random() * Math.PI * 2
        });
      }
      if (still.matches) draw(0);
    }

    function draw(t) {
      ctx.clearRect(0, 0, w, h);
      const last = RAMP.length - 1;
      for (const s of stars) {
        // never off, never full: the field breathes rather than blinks
        const l = s.base * (0.55 + 0.45 * Math.sin(t * s.speed + s.phase));
        const idx = Math.max(0, Math.min(last, Math.round(l * last)));
        ctx.font = (6 + idx * 1.2).toFixed(1) + 'px ' + GLYPH;
        // the app peaks near .41 alpha; landing under .30 keeps this behind the
        // type without dimming the field to the point of not reading as a sky
        ctx.fillStyle = 'rgba(' + INK + ', ' + (0.05 + 0.25 * l).toFixed(3) + ')';
        ctx.fillText(RAMP[idx], s.x, s.y);
      }
    }

    layout();
    // Kumar One may still be in flight, and the wordmark is what sets how wide
    // the clearing has to be — re-measure once it lands
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
    window.addEventListener('resize', layout);

    if (still.matches) return;      // one static frame is the whole animation

    const t0 = performance.now();
    let lastFrame = 0;
    (function loop(now) {
      requestAnimationFrame(loop);
      if (now - lastFrame < 1000 / FPS) return;
      lastFrame = now;
      draw((now - t0) / 1000);
    })(t0);
  })();
  </script>
</body>
</html>
